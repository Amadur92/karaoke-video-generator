name: Application checks

on:
  push:
    branches: ['**']
    paths: ['desktop_app/**', 'worker/**', 'scripts/**', '.github/workflows/quality.yml']
  pull_request:
    paths: ['desktop_app/**', 'worker/**', 'scripts/**', '.github/workflows/quality.yml']
  workflow_dispatch:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install native and rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install smoke test dependencies
        run: python -m pip install 'Pillow>=10,<12'
      - name: Python logic and regression tests
        run: |
          python worker/test_karaoke_logic.py
          python worker/test_resolver_logic.py
          python worker/test_runtime_integrity.py
          python -m compileall -q worker scripts
      - name: Rust formatting, lint and regression tests
        run: |
          cargo fmt --manifest-path desktop_app/Cargo.toml -- --check
          cargo clippy --manifest-path desktop_app/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path desktop_app/Cargo.toml --all-targets
          cargo test --manifest-path desktop_app/Cargo.toml --lib -- --ignored
      - name: Real MP4 rendering and loudness checks
        run: |
          cargo build --manifest-path desktop_app/Cargo.toml --bin karaoke_render
          python scripts/render_smoke.py --renderer desktop_app/target/debug/karaoke_render --ffmpeg "$(command -v ffmpeg)" --ffprobe "$(command -v ffprobe)" --engine ass
          python scripts/render_smoke.py --renderer desktop_app/target/debug/karaoke_render --ffmpeg "$(command -v ffmpeg)" --ffprobe "$(command -v ffprobe)" --engine frames
          python scripts/loudness_smoke.py --renderer desktop_app/target/debug/karaoke_render
