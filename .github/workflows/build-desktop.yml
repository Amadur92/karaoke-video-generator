name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Tests and rendering checks
    uses: ./.github/workflows/quality.yml

  windows-box:
    name: Build Windows portable box
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop_app/target
          key: windows-box-cargo-${{ hashFiles('desktop_app/Cargo.lock') }}
          restore-keys: windows-box-cargo-

      - name: Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: windows-box-pip-${{ hashFiles('worker/requirements.txt') }}
          restore-keys: windows-box-pip-

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Build portable Windows folder
        shell: pwsh
        run: |
          $ffmpegExe = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if ($null -eq $ffmpegExe) {
            throw "ffmpeg.exe was not found after Chocolatey install."
          }
          $ffmpegDir = $ffmpegExe.Directory.FullName
          .\packaging\windows\build_box.ps1 -Python python -FfmpegDir $ffmpegDir

      - name: Verify packaged renderer
        shell: pwsh
        run: |
          $box = "packaging\dist\KaraokeGenerator-windows"
          $renderer = Join-Path $box "worker\karaoke_render.exe"
          $ffmpeg = Join-Path $box "bin\ffmpeg.exe"
          $ffprobe = Join-Path $box "bin\ffprobe.exe"
          $filters = (& $ffmpeg -hide_banner -filters 2>&1 | Out-String)
          if ($filters -notmatch "\sass\s+V->V|\ssubtitles\s+V->V") {
            throw "Packaged FFmpeg does not contain ASS/subtitles support."
          }
          python scripts/render_smoke.py --renderer $renderer --ffmpeg $ffmpeg --ffprobe $ffprobe --engine ass
          python scripts/render_smoke.py --renderer $renderer --ffmpeg $ffmpeg --ffprobe $ffprobe --engine frames

      - name: Create Windows zip
        shell: pwsh
        run: |
          $zipPath = "packaging\dist\KaraokeGenerator-Windows-x64-portable.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "packaging\dist\KaraokeGenerator-windows\*" -DestinationPath $zipPath

      - name: Upload Windows box artifact
        uses: actions/upload-artifact@v7
        with:
          name: KaraokeGenerator-Windows-x64-portable
          path: packaging/dist/KaraokeGenerator-Windows-x64-portable.zip

  macos-box:
    name: Build macOS portable box (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: quality
    timeout-minutes: 120
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            label: Intel x64
            artifact_name: KaraokeGenerator-macOS-Intel-x64-portable
            app_dmg_name: KaraokeGenerator-macOS-Intel-x64-app.dmg
          - os: macos-latest
            label: Apple Silicon arm64
            artifact_name: KaraokeGenerator-macOS-AppleSilicon-arm64-portable
            app_dmg_name: KaraokeGenerator-macOS-AppleSilicon-arm64-app.dmg

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop_app/target
          key: macos-box-${{ matrix.artifact_name }}-cargo-${{ hashFiles('desktop_app/Cargo.lock') }}
          restore-keys: macos-box-${{ matrix.artifact_name }}-cargo-

      - name: Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/pip
          key: macos-box-${{ matrix.artifact_name }}-pip-${{ hashFiles('worker/requirements.txt') }}
          restore-keys: macos-box-${{ matrix.artifact_name }}-pip-

      - name: Install FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1 && ffmpeg -hide_banner -filters 2>/dev/null | grep ' ass ' >/dev/null; then
            ffmpeg_dir="$(dirname "$(command -v ffmpeg)")"
          else
            brew install ffmpeg-full
            ffmpeg_dir="$(brew --prefix ffmpeg-full)/bin"
          fi
          "$ffmpeg_dir/ffmpeg" -hide_banner -filters 2>/dev/null | grep ' ass ' >/dev/null
          echo "$ffmpeg_dir" >> "$GITHUB_PATH"
          echo "FFMPEG_BIN=$ffmpeg_dir/ffmpeg" >> "$GITHUB_ENV"
          echo "FFPROBE_BIN=$ffmpeg_dir/ffprobe" >> "$GITHUB_ENV"

      - name: Build portable macOS folder
        run: ./packaging/macos/build_box.sh

      - name: Verify packaged renderer and sandbox
        run: |
          BOX="packaging/dist/KaraokeGenerator-macos"
          ./packaging/macos/smoke_sandbox.sh "$BOX" --check-only
          python3 scripts/render_smoke.py \
            --renderer "$BOX/worker/karaoke_render" \
            --ffmpeg "$BOX/bin/ffmpeg" \
            --ffprobe "$BOX/bin/ffprobe" \
            --engine ass
          python3 scripts/render_smoke.py \
            --renderer "$BOX/worker/karaoke_render" \
            --ffmpeg "$BOX/bin/ffmpeg" \
            --ffprobe "$BOX/bin/ffprobe" \
            --engine frames

      - name: Create macOS tarball
        run: |
          cd packaging/dist
          tar -czf "${{ matrix.artifact_name }}.tar.gz" KaraokeGenerator-macos

      - name: Upload macOS box artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: packaging/dist/${{ matrix.artifact_name }}.tar.gz

      - name: Build macOS app DMG
        env:
          DMG_NAME: ${{ matrix.app_dmg_name }}
          SIGN_IDENTITY: "-"
          SKIP_BUILD_BOX: "1"
        run: ./packaging/macos/build_app_dmg.sh

      - name: Upload macOS app DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app_dmg_name }}
          path: packaging/dist/${{ matrix.app_dmg_name }}

  release:
    needs: [quality, windows-box, macos-box]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
