name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-box:
    name: Build Windows portable box
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop_app/target
          key: windows-box-cargo-${{ hashFiles('desktop_app/Cargo.lock') }}
          restore-keys: windows-box-cargo-

      - name: Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: windows-box-pip-${{ hashFiles('worker/requirements.txt') }}
          restore-keys: windows-box-pip-

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Build portable Windows folder
        shell: pwsh
        run: |
          $ffmpegExe = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if ($null -eq $ffmpegExe) {
            throw "ffmpeg.exe was not found after Chocolatey install."
          }
          $ffmpegDir = $ffmpegExe.Directory.FullName
          .\packaging\windows\build_box.ps1 -Python python -FfmpegDir $ffmpegDir

      - name: Create Windows zip
        shell: pwsh
        run: |
          $zipPath = "packaging\dist\KaraokeGenerator-Windows-x64-portable.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "packaging\dist\KaraokeGenerator-windows\*" -DestinationPath $zipPath

      - name: Upload Windows box artifact
        uses: actions/upload-artifact@v7
        with:
          name: KaraokeGenerator-Windows-x64-portable
          path: packaging/dist/KaraokeGenerator-Windows-x64-portable.zip

  macos-box:
    name: Build macOS portable box (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            label: Intel x64
            artifact_name: KaraokeGenerator-macOS-Intel-x64-portable
          - os: macos-latest
            label: Apple Silicon arm64
            artifact_name: KaraokeGenerator-macOS-AppleSilicon-arm64-portable

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop_app/target
          key: macos-box-${{ matrix.artifact_name }}-cargo-${{ hashFiles('desktop_app/Cargo.lock') }}
          restore-keys: macos-box-${{ matrix.artifact_name }}-cargo-

      - name: Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/pip
          key: macos-box-${{ matrix.artifact_name }}-pip-${{ hashFiles('worker/requirements.txt') }}
          restore-keys: macos-box-${{ matrix.artifact_name }}-pip-

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi

      - name: Build portable macOS folder
        run: ./packaging/macos/build_box.sh

      - name: Create macOS tarball
        run: |
          cd packaging/dist
          tar -czf "${{ matrix.artifact_name }}.tar.gz" KaraokeGenerator-macos

      - name: Upload macOS box artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: packaging/dist/${{ matrix.artifact_name }}.tar.gz

  release:
    needs: [windows-box, macos-box]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
